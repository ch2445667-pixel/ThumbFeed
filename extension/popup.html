<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>ThumbVault Grabber</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    body {
      width: 320px;
      background: #0a0b0e;
      color: #f3f4f6;
      padding: 16px;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
      padding-bottom: 8px;
      border-bottom: 1px solid #232733;
    }
    .title {
      font-size: 14px;
      font-weight: 700;
      color: #fff;
    }
    .title span {
      color: #818cf8;
    }
    .preview-box {
      width: 100%;
      aspect-ratio: 16/9;
      background: #12141a;
      border-radius: 8px;
      overflow: hidden;
      margin-bottom: 12px;
      border: 1px solid #232733;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .preview-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .meta-title {
      font-size: 12px;
      font-weight: 600;
      color: #e5e7eb;
      margin-bottom: 4px;
      line-height: 1.3;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .meta-channel {
      font-size: 11px;
      color: #9ca3af;
      margin-bottom: 12px;
    }
    .btn {
      width: 100%;
      padding: 10px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      border: none;
      transition: all 0.2s;
    }
    .btn-primary {
      background: #4f46e5;
      color: #fff;
      margin-bottom: 6px;
    }
    .btn-primary:hover {
      background: #4338ca;
    }
    .btn-secondary {
      background: #1f2937;
      color: #d1d5db;
    }
    .btn-secondary:hover {
      background: #374151;
      color: #fff;
    }
    .status {
      margin-top: 8px;
      font-size: 11px;
      text-align: center;
      color: #34d399;
      display: none;
    }
    .not-yt {
      font-size: 12px;
      color: #9ca3af;
      text-align: center;
      padding: 20px 0;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="title">Thumb<span>Vault</span></div>
    <span style="font-size: 10px; color: #818cf8; background: rgba(99,102,241,0.1); padding: 2px 6px; border-radius: 4px;">1-Click</span>
  </div>

  <div id="content-container">
    <div class="preview-box">
      <img id="thumb-preview" class="preview-img" src="" alt="Thumbnail preview" />
    </div>

    <div class="meta-title" id="video-title">Detecting video...</div>
    <div class="meta-channel" id="channel-name"></div>

    <button id="save-btn" class="btn btn-primary">⚡ Send to ThumbVault</button>
    <button id="download-btn" class="btn btn-secondary">Download HD Image</button>

    <div id="status-msg" class="status">✓ Saved & Auto-Tagged in Vault!</div>
  </div>

  <div id="not-yt-msg" class="not-yt" style="display: none;">
    Please open a YouTube video page to grab its thumbnail.
  </div>

  <script src="popup.js"></script>
</body>
</html>
