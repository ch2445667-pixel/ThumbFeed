<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Thumbnail Detail</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0e0e10;--raised:#151518;--hover:#1c1c20;
  --line:rgba(255,255,255,.07);--line2:rgba(255,255,255,.14);
  --text:#ededef;--muted:#8b8b93;--faint:#5a5a62;
  /* concentric radii: image 12 + padding 12 = modal 24 */
  --pad:12px;--in:12px;--out:calc(var(--in) + var(--pad));
}
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;display:grid;place-items:center;padding:30px;background:radial-gradient(ellipse at 50% 0,#14141a,#050506 70%);color:var(--text);font:13px/1.45 Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
button,a{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-decoration:none}

.m{width:100%;max-width:960px;background:var(--bg);border-radius:var(--out);padding:var(--pad);display:grid;grid-template-columns:1fr 300px;gap:18px;box-shadow:0 0 0 1px var(--line),0 44px 100px -20px #000}
.im{position:relative;aspect-ratio:16/9;align-self:start;border-radius:var(--in);overflow:hidden;background:#000}
.im img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}

.side{display:flex;flex-direction:column;padding:8px 12px 6px 0;min-width:0}
.top{display:flex;justify-content:flex-end}
.xb{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--raised);box-shadow:0 0 0 1px var(--line);color:var(--muted);transition:background .2s}
.xb:hover{background:var(--hover)}

.t{font-size:19px;font-weight:600;letter-spacing:-.025em;line-height:1.3;margin:28px 0 26px}

/* channel + views, no button */
.who{display:flex;align-items:center;gap:12px}
.av{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,#f6a,#68f);display:grid;place-items:center;font:600 11px Inter;color:#fff;font-style:normal;box-shadow:0 0 0 1px var(--line2)}
.who b{display:block;font-weight:500;font-size:13px;line-height:1.25}
.who small{display:block;font-size:12px;color:var(--faint);line-height:1.35}
.who small em{font-style:normal;color:var(--muted);font-weight:500}

.btns{margin-top:auto;padding-top:32px}
.split{display:flex;border-radius:12px;overflow:hidden;background:#f2f2f3;color:#0a0a0b}
.split .main{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;padding:13px;font-weight:500;font-size:12.5px;transition:background .2s}
.split .main:hover{background:#fff}
.split .fmt{display:flex;align-items:center;gap:5px;padding:0 12px;border-left:1px solid rgba(0,0,0,.14);font:500 11px 'JetBrains Mono',monospace;color:#4a4a50;transition:background .2s}
.split .fmt:hover{background:#fff}
.ghost{display:flex;align-items:center;justify-content:center;gap:7px;margin-top:10px;padding:12px;border-radius:12px;box-shadow:0 0 0 1px var(--line2);font-weight:500;font-size:12.5px;color:var(--muted);transition:background .2s}
.ghost:hover{background:rgba(255,255,255,.05)}
@media(max-width:820px){.m{grid-template-columns:1fr}.side{padding:0 8px 8px}.t{margin:18px 0}.btns{padding-top:22px}}
</style>
</head>
